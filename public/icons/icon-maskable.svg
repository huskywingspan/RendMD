      stroke-width="24"
      stroke-linejoin="round"
    />
    <path
      d="M304 104v80h80"
      fill="none"
      stroke="#8aa5f5"
      stroke-width="24"
      stroke-linejoin="round"
    />
    <g stroke="#f2f3f7" stroke-width="24" stroke-linecap="round">
      <path d="M184 256h144" />
      <path d="M184 312h144" />
      <path d="M184 368h88" />
    </g>
  </g>
</svg>
