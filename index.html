<!doctype html>
<html lang="en" class="theme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RendMD</title>
    <meta name="description" content="A rendered-first markdown editor. Open a folder, read and edit your .md files, save straight back to disk. No accounts, no upload, no tracking." />
    <meta name="theme-color" content="#16171c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />

    <!--
      Applies the saved theme and reading preferences before first paint.
      External rather than inline so the CSP can be script-src 'self' with no
      'unsafe-inline'; loaded synchronously because render-blocking is the point.
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
